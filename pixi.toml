[workspace]
name = "amazebio"
description = "Independent audit of exclusion-based data filtering as a safeguard in open-weight biological models"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

# bioconda is declared from the start because most of the Phase A toolchain
# (profile search, structural search, element detection, taxonomy assignment) is
# distributed there rather than on PyPI. Keeping it in the same lockfile as the
# Python dependencies is the whole reason this project uses pixi: AGENTS.md
# requires that a result regenerate from pinned inputs, and a compiled binary
# installed by side-channel instructions is not pinned.
#
# Tools are added by the task that needs them, with a DECISIONS.md entry
# recording the version choice. Do not pre-populate this file with the Phase A
# toolchain — DESIGN.md §7 names scope creep as a live risk, and an unused
# pinned tool is a maintenance cost with no result attached.

[dependencies]
python = "3.12.*"
# Needed by tools/policies.py to verify that every quote in policies/ literally
# appears in the source PDF it cites. CI runs that check, so it is not dev-only.
pypdf = ">=5,<7"
# Filter policy specs in policies/specs/ are YAML: a reviewer has to be able to read a
# policy and check it against the quoted source text, and nested JSON with embedded
# multi-line quotes is not readable. See DECISIONS.md D-013.
pyyaml = ">=6,<7"
# The object-storage client every staging tool uses. Pinned here because it was not:
# A1.3 and A1.2 both imported it as an optional dependency installed by side channel,
# which means the corpora they staged were produced by a client version the lockfile
# does not record. AGENTS.md requires a result to regenerate from pinned inputs, and a
# transfer is only as reproducible as the thing that performed it. Added by A1.5.
boto3 = ">=1.43.111,<2"
# Evo 1's corpus is published as Parquet and nothing else — there is no FASTA tree for
# OpenGenome v1 — and its viral component is the one staged object carrying the taxonomic
# lineage the published filter acts on. A7.1's census and A1.4's policy evaluation both have
# to read it. Reading it row-group by row-group over a ranged object-storage reader is also
# what keeps the pass off local disk, which a 15.8 GiB file in a session container needs.
# Floor from A7.1 (>=18); A1.4 asked only for >=17, so the tighter bound governs.
pyarrow = ">=18,<22"
# A7.2 joins 15.7 million IMG/VR accessions against two other sets and groups them by vOTU.
# Those are sorts, set memberships and bincounts over tens of millions of integers: a dict of
# 15.7 million strings does not fit the container the pass runs in, and the packed-integer
# columns `amazebio.imgvr.uvig_key` produces need an array library to be joined at all. Added
# by A7.2, which is the first task whose arithmetic is too large for the standard library.
numpy = ">=2,<3"

# Make `import amazebio` work in every pixi task and shell without a build step
# or an editable pip install, so a pipeline script and a test see the same package.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

# geNomad is the tool A4.2 benchmarks: IMG/VR v4 assigns 91.7% of the taxonomic
# classifications every Evo denylist rule reads with it, and the filter inherits its
# errors. It lives in its own environment rather than the default one because the
# version contemporaneous with IMG/VR v4 carries 2022-era TensorFlow and Keras pins,
# and solving those against the default environment would hold the whole project back
# to them. Version choice and the stated-vs-used gap: see DECISIONS.md.
# linux-64 only, and deliberately: this environment exists to run a 2022 tool, and the
# 2022 TensorFlow and numpy builds it needs were never published for osx-arm64. The
# benchmark is a linux pipeline; the rest of the project stays cross-platform.
[feature.genomad]
platforms = ["linux-64"]

[feature.genomad.dependencies]
genomad = "==1.1.0"
# Not cosmetic pins. geNomad 1.1.0's `marker_classification` calls `np.warnings`,
# which numpy removed in 1.24, so the tool does not import at all against a current
# numpy; and numpy 1.23 is the last series built for Python 3.10. Pinning the
# interpreter and the array library to what the tool was written against is what makes
# the 2022 version runnable in 2026 — the alternative is benchmarking a version the
# filter cannot have used.
python = "3.10.*"
numpy = ">=1.21,<1.24"
# The search engine, pinned to the series geNomad 1.1.0's own recipe floors at and the one
# contemporaneous with the marker database it pairs with. Not a preference: the current
# mmseqs2 (18.x) dies in the prefilter against the 2022 profile database however far the
# search is split, and a benchmark cannot report a tool's error rate from a run that did
# not finish. Pinning it also keeps the whole search faithful to what the filter's labels
# came out of, which is the point of benchmarking a 2022 version at all.
mmseqs2 = "==13.45111"

[feature.dev.dependencies]
pytest = ">=8.3,<9"
ruff = ">=0.8,<0.9"

[environments]
default = { features = [], solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }
# Its own solve group: see the comment on `feature.genomad.dependencies`.
# `no-default-feature` because the project's `[dependencies]` pin python 3.12, and the
# whole point of this environment is the interpreter geNomad 1.1.0 predates. It holds the
# tool and nothing else; the pipeline calls its CLI from the dev environment.
genomad = { features = [
  "genomad",
], solve-group = "genomad", no-default-feature = true }

[tasks]
# Regenerate the task board from task frontmatter.
board = "python3 tools/board.py"

[feature.dev.tasks]
# Validate the task graph and board freshness. CI runs this.
board-check = "python3 tools/board.py --check"
test = "pytest -q"
# Verify every quote in policies/ literally appears in the source it cites.
policies-check = "python3 tools/policies.py"
# Validate the filter policy specs: schema, and that every rule cites a retrieved source.
specs-check = "python3 tools/specs.py"
# Validate the Phase B model inventory: every checkpoint's claims cite a retrieved source.
models-check = "python3 tools/model_inventory.py --check"
# Render each policy as prose, for eyeballing a spec against its quoted source.
specs = "python3 tools/specs.py --describe"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
# Everything CI runs, in one command.
check = { depends-on = [
  "lint",
  "fmt-check",
  "board-check",
  "policies-check",
  "specs-check",
  "models-check",
  "test",
] }
