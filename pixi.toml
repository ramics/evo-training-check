[workspace]
name = "amazebio"
description = "Independent audit of exclusion-based data filtering as a safeguard in open-weight biological models"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

# bioconda is declared from the start because most of the Phase A toolchain
# (profile search, structural search, element detection, taxonomy assignment) is
# distributed there rather than on PyPI. Keeping it in the same lockfile as the
# Python dependencies is the whole reason this project uses pixi: AGENTS.md
# requires that a result regenerate from pinned inputs, and a compiled binary
# installed by side-channel instructions is not pinned.
#
# Tools are added by the task that needs them, with a DECISIONS.md entry
# recording the version choice. Do not pre-populate this file with the Phase A
# toolchain — DESIGN.md §7 names scope creep as a live risk, and an unused
# pinned tool is a maintenance cost with no result attached.

[dependencies]
python = "3.12.*"
# Needed by tools/policies.py to verify that every quote in policies/ literally
# appears in the source PDF it cites. CI runs that check, so it is not dev-only.
pypdf = ">=5,<7"
# Filter policy specs in policies/specs/ are YAML: a reviewer has to be able to read a
# policy and check it against the quoted source text, and nested JSON with embedded
# multi-line quotes is not readable. See DECISIONS.md D-013.
pyyaml = ">=6,<7"
# The object-storage client every staging tool uses. Pinned here because it was not:
# A1.3 and A1.2 both imported it as an optional dependency installed by side channel,
# which means the corpora they staged were produced by a client version the lockfile
# does not record. AGENTS.md requires a result to regenerate from pinned inputs, and a
# transfer is only as reproducible as the thing that performed it. Added by A1.5.
boto3 = ">=1.43.111,<2"
# Evo 1's corpus is published as Parquet and nothing else — there is no FASTA tree for
# OpenGenome v1 — and its viral component is the one staged object carrying the taxonomic
# lineage the published filter acts on. A7.1's census and A1.4's policy evaluation both have
# to read it. Reading it row-group by row-group over a ranged object-storage reader is also
# what keeps the pass off local disk, which a 15.8 GiB file in a session container needs.
# Floor from A7.1 (>=18); A1.4 asked only for >=17, so the tighter bound governs.
pyarrow = ">=18,<22"
# Profile search is A2.1's whole method, and HMMER is the tool §A2 names. `pyhmmer` rather than
# the `hmmer` binaries because the search runs inside the pipeline that reads the corpus: a
# subprocess would need the translated sequences written to disk first, and the surviving set is
# too large for that to be anything but a staging problem. It also makes the per-model gathering
# cutoffs readable from the profile itself, which is what lets A2.1's thresholds be Pfam's own
# curated ones rather than an E-value this project picked (DECISIONS.md D-076). Vendors HMMER
# 3.4 internally; `pyhmmer.hmmer.__version__` records which, and `run.json` pins it.
pyhmmer = ">=0.12.3,<0.13"
# Evo's surviving corpora are nucleotide and the profiles are protein, so something has to decide
# what the reading frames are. Gene calling in metagenomic mode rather than six-frame translation
# because six frames put five wrong answers beside every right one and a profile hit on a frame
# no gene occupies is a false positive this audit cannot afford to report (D-077). Prodigal is
# the caller IMG/VR's own annotation pipeline uses, so the genes are called the way the records'
# publisher calls them. `pyrodigal` for the same in-process reason as `pyhmmer`.
pyrodigal = ">=3.7.1,<4"
# A2.2's reference set is 141 ECOD representative *domains*, and a domain is a residue range
# inside a chain inside a PDB entry — D-166 rejected whole-chain reference databases precisely
# because a capsid fold sitting inside a larger protein is the case that matters. So the
# structures have to be cut to ECOD's ranges before `foldseek createdb` sees them, which needs a
# real mmCIF parser: ECOD's ranges carry insertion codes (`A:1B-99A`) and author numbering that
# does not start at 1, and a hand-rolled ATOM-record filter gets both wrong silently. Added by
# A2.2.
gemmi = ">=0.6,<0.8"
# A7.2 joins 15.7 million IMG/VR accessions against two other sets and groups them by vOTU.
# Those are sorts, set memberships and bincounts over tens of millions of integers: a dict of
# 15.7 million strings does not fit the container the pass runs in, and the packed-integer
# columns `amazebio.imgvr.uvig_key` produces need an array library to be joined at all. Added
# by A7.2, which is the first task whose arithmetic is too large for the standard library.
numpy = ">=2,<3"
mmseqs2 = ">=17"

# Make `import amazebio` work in every pixi task and shell without a build step
# or an editable pip install, so a pipeline script and a test see the same package.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

# geNomad is the tool A4.2 benchmarks: IMG/VR v4 assigns 91.7% of the taxonomic
# classifications every Evo denylist rule reads with it, and the filter inherits its
# errors. It lives in its own environment rather than the default one because the
# version contemporaneous with IMG/VR v4 carries 2022-era TensorFlow and Keras pins,
# and solving those against the default environment would hold the whole project back
# to them. Version choice and the stated-vs-used gap: see DECISIONS.md.
# linux-64 only, and deliberately: this environment exists to run a 2022 tool, and the
# 2022 TensorFlow and numpy builds it needs were never published for osx-arm64. The
# benchmark is a linux pipeline; the rest of the project stays cross-platform.
[feature.genomad]
platforms = ["linux-64"]

[feature.genomad.dependencies]
genomad = "==1.1.0"
# Not cosmetic pins. geNomad 1.1.0's `marker_classification` calls `np.warnings`,
# which numpy removed in 1.24, so the tool does not import at all against a current
# numpy; and numpy 1.23 is the last series built for Python 3.10. Pinning the
# interpreter and the array library to what the tool was written against is what makes
# the 2022 version runnable in 2026 — the alternative is benchmarking a version the
# filter cannot have used.
python = "3.10.*"
numpy = ">=1.21,<1.24"
# The search engine, pinned to the series geNomad 1.1.0's own recipe floors at and the one
# contemporaneous with the marker database it pairs with. Not a preference: the current
# mmseqs2 (18.x) dies in the prefilter against the 2022 profile database however far the
# search is split, and a benchmark cannot report a tool's error rate from a run that did
# not finish. Pinning it also keeps the whole search faithful to what the filter's labels
# came out of, which is the point of benchmarking a 2022 version at all.
mmseqs2 = "==13.45111"

# A2.4's detection instruments, and deliberately *not* `feature.genomad` above. That
# environment pins geNomad 1.1.0 because A4.2 benchmarks the version IMG/VR's own labels
# came out of — geNomad there is the object of study. Here geNomad is the audit's
# instrument, and DESIGN.md §A2 opens by requiring the audit's instruments to be
# independent of the filter's, "or it will reproduce the filter's own blind spots".
# Detecting with the same 2022 build against the same 2022 markers is the sharpest form of
# exactly that. Two pins for two roles, and D-112 records why they must not be unified.
[feature.proviruses]
platforms = ["linux-64"]

[feature.proviruses.dependencies]
# 1.12.0 rather than 1.13.0, which is three days old at pinning and which the publisher's
# own `releases.txt` does not yet pair with any marker database. 1.12 is the newest package
# the publisher attests against database v1.9, and an attested pairing is what the pin
# needs — see D-112.
genomad = "==1.12.0"

# The second tool the concordance criterion is measured against. §A2 names VIBRANT, and its
# mechanism is independent of geNomad's in the way the criterion needs: HMM scoring against
# KEGG/Pfam/VOG with a metabolic-signature rule, against geNomad's marker consensus plus
# neural classifier. Its own solve group because 1.2.1 pins an older Python and an older
# HMMER than the rest of the project runs.
[feature.vibrant]
platforms = ["linux-64"]

[feature.vibrant.dependencies]
vibrant = "==1.2.1"

# A2.3's registry acquisition, and only that. The element registry §A2 names is Dfam, which
# ships as a partitioned HDF5 database rather than as a flat profile library, so something has to
# read it to get the profiles out. `famdb` is the publisher's own reader and this is the only
# place it is used: the export runs once, produces the pinned registry artefact, and the
# detection pass that follows reads that artefact with `pyhmmer` — already in `[dependencies]`
# for A2.1 — and never touches the database again.
#
# Version 3.0.0 is not a preference. Dfam 4.0's own README states the pairing: "This new format
# is compatible with FamDB tool v3.0.0, and RepeatMasker 4.2.4." The previous release's files are
# format 2.0.0 and this reader refuses them outright, so the tool and the database release are
# one pin rather than two. Same principle as D-112's geNomad-to-marker-database pairing: an
# attested pairing is what the pin needs.
#
# Deliberately *not* `repeatmasker`, which is what pulled `famdb` in while this was being worked
# out. RepeatMasker is a search engine and this project already has one; adding a second would
# mean a second set of thresholds, a second cost model and a compiled toolchain to pin. The
# 25 MB of annotation data the conda package bundles is not a repeat library — it ships no
# Dfam at all — so it would not have saved the acquisition step either.
#
# D-186 later measured the profile route at 48,040 core-hours over the 1% band and moved the
# arm to a seeded aligner over each model's own consensus, which `mmseqs2` in `[dependencies]`
# already provides. That reverses this comment's cost premise, not its conclusion: the switch
# needs no new tool either, so `famdb` is still the only thing this task pins.
#
# Its own solve group and `no-default-feature` for the reason the other tool environments have
# theirs: it holds a tool and its runtime, and the pipeline calls it from the dev environment.
[feature.dfam]
platforms = ["linux-64", "osx-arm64"]

[feature.dfam.dependencies]
famdb = "==3.0.0"

# A2.2's instrument. §A2 names Foldseek for the three virus-characteristic folds, and 10.941cd33
# is the newest bioconda release at pinning. Its own environment and solve group because the
# package is a compiled binary with no Python side the pipeline imports — the pipeline calls its
# CLI, exactly as A2.4 calls geNomad's.
#
# Two things about this pin are load-bearing and were established rather than assumed (D-163).
# bioconda ships **one** linux-64 build per version with no CUDA variant, so whether the packaged
# binary could use a GPU at all was open; `--gpu 1` on a machine without one reports "No GPU
# devices found" rather than "compiled without CUDA", which settles that this build is
# CUDA-capable and therefore that the GPU route stays a lockfile entry instead of a side-channel
# binary. That matters because 3Di prediction is the whole cost of A2.2 — 18.58 core-hours per
# million residues on CPU, 173x the profile search it feeds — so the binary that does it is the
# one part of this task that must be pinned rather than downloaded.
[feature.foldseek]
platforms = ["linux-64"]

[feature.foldseek.dependencies]
foldseek = "==10.941cd33"

# B1.2's scoring harness needs weights loaded, and weights need a tensor library. It is a
# feature rather than a default dependency because pytorch and transformers are most of a
# gigabyte and every other task in this project — the whole of Phase A — needs neither. The
# split in the code mirrors the split here: `amazebio.scoring` and `amazebio.backends` are
# torch-free so the §4 refusals stay testable in the default environment, and only
# `tools/score_variants.py` reaches for this one, inside a single function.
#
# CPU, deliberately. Masked-marginal scoring is one forward pass per masked position, and for
# the assays B1.2 validates against that is a few hundred passes over sequences of a few
# hundred residues — minutes in the session container. AGENTS.md's test for launching an
# instance is data movement that is free in-region, and this is not that. The GPU route stays
# open for the full Phase B sweep, where the arithmetic changes.
#
# Its own solve group so a tensor library's pins cannot reach into the environment the Phase A
# pipelines run in, but *with* the default feature, because the harness imports `amazebio` and
# needs the project's own interpreter and numpy.
[feature.score]
platforms = ["linux-64"]

[feature.score.dependencies]
# The reference implementation for the ESM-2 checkpoints in B1.1's inventory, whose published
# access route names `transformers.EsmForMaskedLM`.
pytorch = ">=2.11,<2.12"
transformers = ">=4.57.6,<5"

# ESM3-open and ESM-C are not reachable through `transformers.EsmForMaskedLM`: their
# published access route is EvolutionaryScale's own package, and `amazebio.backends`
# records that verbatim rather than substituting a route the authors did not name. It is a
# PyPI dependency because it is not packaged for conda-forge. ESM3-open is the test
# condition of the whole audit, so this is not an optional extra.
[feature.score.pypi-dependencies]
esm = ">=3.4.1.post1,<4"

# B4.1's non-neural baseline. The method has no free parameters, but it has several specified
# procedures — notably a sequence-weighting step that clusters the alignment at 80% identity and
# is quadratic in its depth, which is why the authors ship a C++ backend. D-229 records the
# choice to integrate their MIT-licensed implementation rather than reimplement it, so the
# baseline is theirs rather than this project's reading of their paper. PyPI because it is not
# packaged for conda-forge; the compiler is needed to build its extension.
[feature.baseline]
platforms = ["linux-64"]

[feature.baseline.dependencies]
cxx-compiler = ">=1.8,<2"
biopython = ">=1.84,<2"
numpy = ">=2,<3"

[feature.baseline.pypi-dependencies]
rsalor = ">=1.1,<2"

[feature.dev.dependencies]
pytest = ">=8.3,<9"
ruff = ">=0.8,<0.9"

[environments]
default = { features = [], solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }
# B1.2's scoring environment. See the comment on `feature.score.dependencies`.
score = { features = ["score", "dev"], solve-group = "score" }
# B4.1's baseline environment. Its own solve group: `rsalor` builds a C++ extension and pins
# numpy, and resolving that beside the scoring stack would drag the whole main group.
baseline = { features = ["baseline", "dev"], solve-group = "baseline" }
# Its own solve group: see the comment on `feature.genomad.dependencies`.
# `no-default-feature` because the project's `[dependencies]` pin python 3.12, and the
# whole point of this environment is the interpreter geNomad 1.1.0 predates. It holds the
# tool and nothing else; the pipeline calls its CLI from the dev environment.
genomad = { features = [
  "genomad",
], solve-group = "genomad", no-default-feature = true }
# A2.4's instruments. Both are `no-default-feature` and in their own solve groups for the
# same reason `genomad` is: they hold a tool and its runtime, and the pipeline that reads
# the corpus calls their CLIs from the dev environment.
proviruses = { features = [
  "proviruses",
], solve-group = "proviruses", no-default-feature = true }
vibrant = { features = [
  "vibrant",
], solve-group = "vibrant", no-default-feature = true }
# A2.3's registry reader. See the comment on `feature.dfam.dependencies`.
dfam = { features = [
  "dfam",
], solve-group = "dfam", no-default-feature = true }
# A2.2's instrument, same shape as the two above: a binary and its runtime, called as a CLI by
# the pipeline that reads the corpus from the dev environment.
foldseek = { features = [
  "foldseek",
], solve-group = "foldseek", no-default-feature = true }

[tasks]
# Regenerate the task board from task frontmatter.
board = "python3 tools/board.py"

[feature.dev.tasks]
# Validate the task graph and board freshness. CI runs this.
board-check = "python3 tools/board.py --check"
test = "pytest -q"
# Verify every quote in policies/ literally appears in the source it cites.
policies-check = "python3 tools/policies.py"
# Validate the filter policy specs: schema, and that every rule cites a retrieved source.
specs-check = "python3 tools/specs.py"
# Validate the decisions log's identifiers: duplicate IDs, dangling citations, dates.
# board-check validates the task graph and never looks at the log; this is the other half.
decisions-check = "python3 tools/decisions.py"
# Validate the Phase B model inventory: every checkpoint's claims cite a retrieved source.
models-check = "python3 tools/model_inventory.py --check"
# Validate B2.4's assay provenance and licence register against its committed evidence: a
# traceable DOI per assay, an unrecognised licence URL, and whether the deposit whose grant the
# project relies on is still established to be the bytes it read. See assays/README.md.
assays-check = "python3 tools/assay_register.py --check"
# Render each policy as prose, for eyeballing a spec against its quoted source.
specs = "python3 tools/specs.py --describe"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
# Everything CI runs, in one command.
check = { depends-on = [
  "lint",
  "fmt-check",
  "board-check",
  "decisions-check",
  "policies-check",
  "specs-check",
  "models-check",
  "assays-check",
  "test",
] }
