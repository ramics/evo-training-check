# Evo 1 / OpenGenome eukaryote-infecting virus exclusion — STRICT reading.
#
# The broadest reading a cautious reviewer would want, and the one that rests on the authors'
# own statement of what the exclusion was for:
#
#   "By excluding genomic sequences of viruses that infect eukaryotes from our training data, we
#    aimed to ensure our openly shared model did not disseminate the capability to manipulate
#    and design pathogenic human viruses." (Evo 2, p18)
#
# That is a claim about what the released model was not taught. A reviewer holding the policy to
# it reads three things more broadly than the published implementation does:
#
#   1. SCOPE IS THE CORPUS, NOT A COMPONENT. The commitment is about the training data of the
#      model, so every component is in scope — including the eukaryotic reference genomes Evo 2
#      added, whose published curation contains no viral screening step at all (policies/evo.md
#      §5). Under this reading those components are `retained` or `removed` on their merits
#      rather than `out_of_scope`. That difference against the literal reading is the Phase A
#      headline, and A4.3 quantifies it.
#   2. SEQUENCE FROM A VIRUS NEED NOT CARRY A VIRAL LABEL. An endogenous viral element in a host
#      genome is a genomic sequence from a virus that infects eukaryotes, which is exactly the
#      published predicate — but no retrieved source addresses the route (policies/evo.md §4
#      records the searches: zero hits for endogenous, provirus, ERV in either paper). A2.3
#      detects such elements; this reading is what makes them removable rather than invisible.
#   3. ABSENCE OF HOST EVIDENCE IS NOT EVIDENCE OF A PROKARYOTIC HOST. A record "found within a
#      prokaryotic host at least twice" is retained on two observations; a cautious reviewer
#      retains only on positive and exclusively prokaryotic evidence.
#
# What this reading does NOT do, and why each refusal is deliberate:
#
#   * It adds no clade to the published denylist, and no element class the published predicate
#     does not already cover. Every taxon named below is named in Evo 1 Appendix B.2. A broader
#     reading of published words is a finding; a hazard list of our own authorship would be
#     neither traceable to a source nor the thing under audit, and DESIGN.md §4 keeps this
#     project to published material on well-characterised proteins.
#   * It does not remove prophage, and nothing here reaches phage. IMG/VR is described in the
#     source as "curated prokaryotic viruses" and phage retention is explicit and deliberate, so
#     removing them would contradict a published decision rather than read it strictly. Phage
#     retention is also what gives Phase A its within-corpus contrast (policies/evo.md §5).
#     "Strict" means the broadest defensible reading of the stated aim, not the largest filter
#     expressible.

policy:
  id: evo1-strict
  model: Evo 1 (inherited unchanged by Evo 2)
  reading: strict
  source: S-EVO2-PREPRINT
  note: >-
    Rule-level `components` carry the weight here. The policy's scope is the whole corpus, but a
    viral-taxonomy predicate cannot be applied to a bacterial or vertebrate genome record: it
    has no viral realm to be unspecific about and no vOTU. So the taxonomy and host rules
    declare the viral component they can act on, and the element-detection rule — the one that
    does not need a viral label — acts everywhere. A component reached by no rule evaluates to
    `retained`, which is the honest answer: it was examined and nothing removed it. That is a
    different claim from `out_of_scope`, and keeping the two apart is the point of the schema.

  scope:
    components: ["*"]
    note: >-
      Every component, named or not: GTDB v214.1 prokaryotic genomes, IMG/VR v4 viruses, IMG/PR
      plasmids, and the 16,704 eukaryotic reference genomes Evo 2 added. The wildcard rather
      than an enumeration is deliberate — the components whose curation nobody published are
      precisely the ones this reading exists to reach, so they cannot be listed by name.

  rules:
    - id: remove-eukaryote-infecting-elements
      kind: remove_if_element_detected
      components: ["*"]
      source: S-EVO2-PREPRINT
      locator: p4
      params:
        element_classes:
          - endogenous-viral-element
          - endogenous-retrovirus
          - provirus
      note: >-
        The rule that distinguishes this reading. "We excluded genomic sequences from viruses
        that infect eukaryotic hosts from the training data" is a predicate about the sequence,
        not about the record that carries it; an integrated element in a host genome satisfies it
        on the published words alone. Element classes are the routes DESIGN.md §A2 enumerates for
        eukaryotic hosts — retroviral and non-retroviral endogenous elements, and integrated
        proviruses — and detection is A2.3's, consumed here rather than performed here. No
        retrieved source addresses this route either way, so this is a reading of the published
        predicate, not a report of what the authors did.

    - id: keep-high-confidence
      kind: keep_if_attribute_in
      components: [IMG/VR]
      source: S-EVO1-PREPRINT
      locator: Appendix B.2, p32
      params:
        attribute: confidence
        values: ["High-confidence"]
      note: >-
        Carried unchanged from the literal reading and scoped to the component whose metadata
        defines it. Kept in all three readings so A0.4's spread isolates interpretive difference;
        a quality gate is not a hazard predicate in any reading.

    - id: keep-one-per-votu
      kind: keep_one_per
      components: [IMG/VR]
      source: S-EVO1-PREPRINT
      locator: Appendix B.2, p32
      params:
        attribute: vOTU
      note: Carried unchanged; deduplication, and only IMG/VR records have a vOTU.

    - id: keep-only-exclusively-prokaryotic-hosts
      kind: keep_if_host_evidence_exclusive
      components: [IMG/VR]
      source: S-EVO1-PREPRINT
      locator: Appendix B.2, p32
      params:
        host_class: prokaryotic
      note: >-
        The strict reading of "These sequences were further curated to remove potential
        eukaryotic viruses by keeping only sequences whose assigned taxonomic classification was
        found within a prokaryotic host at least twice." The published rule retains a record on
        two prokaryotic observations even when eukaryotic host evidence also exists, and retains
        nothing on an absent host assignment. A reviewer asking whether the model was taught
        eukaryote-infecting viral sequence requires positive host evidence that is exclusively
        prokaryotic, and treats a record with mixed or missing evidence as unresolved and
        therefore removable. This subsumes the charitable reading's eukaryotic-host rule, so that
        rule does not appear separately here.

    - id: remove-denylisted-families
      kind: remove_if_taxon_in
      components: [IMG/VR]
      source: S-EVO1-PREPRINT
      locator: Appendix B.2, p32
      params:
        rank: family
        names:
          - Adenoviridae
          - Caliciviridae
          - Coronaviridae
          - Filoviridae
          - Flaviviridae
          - Hantaviridae
          - Hepadnaviridae
          - Herpesviridae
          - Orthomyxoviridae
          - Papillomaviridae
          - Paramyxoviridae
          - Picornaviridae
          - Poxviridae
          - Reoviridae
          - Retroviridae
          - Rhabdoviridae
          - Circoviridae
          - Geminiviridae
          - Picobirnaviridae
      note: >-
        The 19 families named in the source, unchanged. The strict reading broadens where the
        policy reaches, never whose names are on the list.

    - id: remove-denylisted-orders
      kind: remove_if_taxon_in
      components: [IMG/VR]
      source: S-EVO1-PREPRINT
      locator: Appendix B.2, p32
      params:
        rank: order
        names:
          - Amarillovirales
          - Durnavirales
          - Geplafuvirales
          - Herpesvirales
          - Lefavirales
          - Ortervirales
          - Orthopolintovirales
          - Piccovirales
          - Picornavirales
          - Priklausovirales
          - Cirlivirales
          - Mulpavirales
      note: The 12 orders named in the source, unchanged.

    - id: remove-taxonomically-unspecific
      kind: remove_if_unspecific
      components: [IMG/VR]
      source: S-EVO1-PREPRINT
      locator: Appendix B.2, p32
      params:
        require_rank: family
        ranks: [realm, kingdom, phylum, class, order, family, genus, species]
        stop_taxa:
          - Riboviria
          - Monodnaviria
          - Heunggongvirae
          - Bamfordvirae
          - Preplasmiviricota
          - Cressdnaviricota
          - Pisuviricota
          - Tectiliviricetes
      note: >-
        The stop-taxa are the eight named in the source, unchanged. The one strict move is the
        required rank: realm in the literal reading, family here. The argument is internal to the
        published procedure — the denylist operates at family and order, so a record assigned
        only to a realm, kingdom, phylum or class cannot be tested against it at all. Reading
        "viruses with poor taxonomic specificity were excluded" at the granularity the filter
        itself needs makes the eight stop-taxa an illustration of a rule rather than its whole
        content. This is also the rule whose decay A9.1 measures, and raising the rank raises the
        exposure to taxonomy churn, which is itself worth reporting.
