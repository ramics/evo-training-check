name: board

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Validates the task dependency graph (unknown IDs, cycles, stale `blocks`
      # lists, status/dependency inconsistencies) and that tasks/BOARD.md is not
      # stale. See AGENTS.md.
      - run: python3 tools/board.py --check
